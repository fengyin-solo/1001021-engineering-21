services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 容器内前端经服务名访问后端
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
